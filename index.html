            justify-content: center;
            align-items: center;

        }

        .logo-img {

            border-radius: 8px;

        }

        /* Telegram CTA Button */
        .join-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(180deg, #00aaff 0%, #0077ff 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(0, 136, 204, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
        }

        .join-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 136, 204, 0.6);
        }

        .redirect-text {
            color: #9ca3af;
            font-size: 13px;

            <div class="tag">Free to Join</div>
        </div>

        <!-- Join Telegram Button -->
        <button onclick="handleJoinTelegram()" class="join-btn" id="telegramBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

        </div>
    </div>

    <script>
        const TELEGRAM_LINK = "https://t.me/+CnIS6WOJxaplNjZl";

        let isRedirected = false;

        function handleJoinTelegram() {
            if (isRedirected) return;
            isRedirected = true;

            // 1. Meta Pixel Subscribe Event Fire
            if (typeof fbq !== 'undefined') {
                fbq('track', 'Subscribe');
            }

            // 2. Redirect to Telegram
            setTimeout(() => {
                window.location.href = TELEGRAM_LINK;
            }, 300);
        }

        // 15 Second Countdown Timer
        let timeLeft = 15;
        const countdownElement = document.getElementById('countdown');

        const timer = setInterval(() => {
            timeLeft--;
            countdownElement.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                handleJoinTelegram();
            }
        }, 1000);
    </script>
