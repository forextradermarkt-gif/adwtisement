    <!-- Meta Pixel Code -->
    <script>
    // Unique Event ID Generator (Deduplication & High Match Quality)
    function generateEventId() {
        return 'evt_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
    }
    
    window.pageEventId = generateEventId();

    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    
    // Pixel Init
    fbq('init', '1808113170219505');

    // 1. PageView Event with Full Parameters (Fixes "No parameters detected" error)
    fbq('track', 'PageView', {
        page_name: 'Gujarati Trader Landing Page',
        content_category: 'Trading Community',
        page_title: document.title,
        url: window.location.href
    }, {eventID: window.pageEventId});

    // Function to Track Telegram Join Button Click
    function trackTelegramClick() {
        let eventId = generateEventId();

        // 2. Track Subscribe Event with Parameters
        fbq('track', 'Subscribe', {
            content_name: 'Telegram Channel Join',
            content_category: 'Community',
            status: 'Success',
            value: 0.00,
            currency: 'INR'
        }, {eventID: 'sub_' + eventId});

        // 3. Track Contact Event with Parameters
        fbq('track', 'Contact', {
            content_name: 'Telegram Link Click',
            content_category: 'Social Link',
            status: 'Clicked'
        }, {eventID: 'cnt_' + eventId});
    }
    </script>

    <!-- Live Background Counting Script -->
    <script>
        function startCounter() {
            let obj = document.getElementById("memberCount");
            if (!obj) return;

            let start = 98750; 
            let end = 100000;  
            let duration = 2000; 
            let startTime = null;

            function step(timestamp) {
                if (!startTime) startTime = timestamp;
                let progress = timestamp - startTime;
                
                let current = Math.min(Math.floor((progress / duration) * (end - start) + start), end);
                obj.innerText = current.toLocaleString('en-US');

                if (progress < duration) {
                    window.requestAnimationFrame(step);
                } else {
                    startInfiniteCounting();
                }
            }
            window.requestAnimationFrame(step);
        }

        function startInfiniteCounting() {
            let obj = document.getElementById("memberCount");
            setInterval(() => {
                let currentVal = parseInt(obj.innerText.replace(/,/g, ''));
                let randomIncrease = Math.floor(Math.random() * 3) + 1; 
                currentVal += randomIncrease;
                obj.innerText = currentVal.toLocaleString('en-US');
            }, 2000); 
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", startCounter);
        } else {
            startCounter();
        }
    </script>
